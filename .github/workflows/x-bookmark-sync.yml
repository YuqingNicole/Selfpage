name: Sync X bookmarks

on:
  schedule:
    # GitHub Actions' shortest supported schedule is every five minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: x-bookmark-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync the Selfpage folder to Supabase
        run: node scripts/sync-x-bookmarks.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_BOOKMARK_FOLDER_NAME: ${{ vars.X_BOOKMARK_FOLDER_NAME }}
